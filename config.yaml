# 离心管液量识别流水线配置
# API Key 请放环境变量 DASHSCOPE_API_KEY，不要写进本文件。

min_fill_percent: 10
crop_padding: 0.10
crop_padding_bottom: 0.22
verbose: true

# 默认 OpenCV 检管；fallback_yolo 为 true 时才需 yolov8s-worldv2.pt
yolo:
  backend: opencv_first
  fallback_yolo: false
  weights: yolov8s-worldv2.pt
  conf: 0.01
  iou: 0.50
  imgsz: 1280
  classes:
    - centrifuge tube
    - microcentrifuge tube
    - eppendorf tube
    - tube
    - plastic vial

liquid:
  backend: local
  tube_top_frac: 0.18
  tube_bottom_frac: 0.05
  center_x_left: 0.28
  center_x_right: 0.72
  meniscus_min_peak: 0.30
  empty_peak_max: 0.26

vlm:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-vl-max
  timeout_sec: 90
  max_image_side: 1280
  prompt_file: prompts/liquid_judge.txt

paths:
  output_dir: output

# 一键取图+识别：POST /v1/inspect 或 /v1/snapshot（无需单独传 jpg）
# backend: usb | v4l2(Linux) | rtsp | plugin（海康/机器人 SDK 写在 plugin 模块里）
server:
  capture:
    # 工位一键：拍照(GigE) → 识别 → JSON（run_inspect.py / EpTubeInspector.capture_and_inspect）
    backend: plugin
    camera_index:
    prefer_usb: true
    width: 1280
    height: 720
    jpeg_quality: 85
    rtsp_url:
    plugin_module: examples.hikvision_gige
    plugin_function: grab_frame
    mvs_development_dir: "D:/桌面/明德实习资料/目前使用的机器人的资料/mvs/MVS/Development"
    mvs_runtime_dir: "C:/Program Files (x86)/Common Files/MVS/Runtime/Win64_x64"
    mvs_device_index: 0
    mvs_feature_file: config/mv_cu120_features.mfs
    mvs_warmup_frames: 45
    # 识别前裁中心区域（%），收窄 X/Y 减少手指与背景干扰
    roi_percent_x: 62
    roi_percent_y: 88
